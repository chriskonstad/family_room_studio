# The whole gate, on every push and PR: `node check.mjs` — conformance, the FR library
# suites, bundle validation, version bumps, a headless bot playtest of every bundle under
# every pressure the harness knows, every shared screen, every phone screen laid out by
# WebKit at six device sizes, each bundle's own tests, and the mutation suite that proves
# all of the above still catches the bugs it claims to.
#
# WebKit because it is the engine inside every iPhone's WKWebView; Linux fonts differ
# from Apple's, so a layout that fits here with room to spare fits on a phone.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the version-bump check compares against main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright-core install --with-deps webkit
      - run: node check.mjs
