<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>TAPAS</title>
<style>
  :root{
    --bg1:#3a1520; --bg2:#20090f; --panel:#4a1e2b; --line:#6b3242;
    --text:#fbeee6; --muted:#c9a09a; --accent:#f0b64b; --good:#7fd896;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none}
  html,body{height:100%}
  body{margin:0; color:var(--text); font-family:ui-rounded,-apple-system,system-ui,sans-serif;
    background:radial-gradient(circle at 50% 0%,#54202f,var(--bg1) 55%,var(--bg2));
    display:flex; flex-direction:column;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  #app{flex:1; display:flex; flex-direction:column; min-height:0; padding:10px 12px 12px}
  .hdr{display:flex; align-items:baseline; gap:8px}
  .brand{font-size:20px; letter-spacing:.16em; font-weight:800; color:var(--accent)}
  .hdr .sub{color:var(--muted); font-size:12.5px; margin-left:auto}
  .banner{min-height:20px; font-size:13.5px; font-weight:600; color:var(--accent); padding:4px 0 6px}

  .plates{display:flex; flex-direction:column; gap:6px; overflow-y:auto}
  .prow{border-radius:12px; padding:7px 10px; background:#3f1a26; border:1px solid transparent; font-size:12.5px}
  .prow.me{border-color:var(--line); background:#4c2130}
  .prow .top{display:flex; gap:6px; align-items:center}
  .prow .who{font-weight:700}
  .prow .pts{margin-left:auto; font-weight:800; font-variant-numeric:tabular-nums}
  .prow .tstack{display:flex; flex-wrap:wrap; gap:4px; margin-top:5px; min-height:20px}
  .mini{display:inline-flex; align-items:center; gap:3px; background:#2c1019; border-radius:6px; padding:2px 6px; font-size:11.5px}
  .picked{color:var(--good); font-size:11px; font-weight:700}

  .sec{font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:8px 2px 4px}
  .hand{display:flex; flex-wrap:wrap; gap:7px; justify-content:center; padding:4px 0}
  .card{width:74px; height:92px; border-radius:12px; background:#fdf3e3; color:#3c1622; border:2px solid transparent;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; box-shadow:0 3px 0 rgba(0,0,0,.35)}
  .card .ic{font-size:26px}
  .card .nm{font-size:10.5px; font-weight:800; text-align:center; line-height:1.1}
  .card .sc{font-size:9px; color:#7c5560; text-align:center; line-height:1.15; padding:0 3px}
  .card.sel{transform:translateY(-8px); border-color:var(--accent)}
  .card.pop{animation:pop .3s ease-out backwards}
  @keyframes pop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}

  .ctrl{padding-top:8px}
  button{font:inherit; cursor:pointer; border:1px solid var(--line); background:#5c2837; color:var(--text);
    border-radius:13px; padding:13px 12px; font-size:15px; font-weight:700; width:100%}
  button:disabled{opacity:.35}
  button.primary{background:var(--accent); color:#3c2206; border-color:var(--accent)}
  .wait{display:block; text-align:center; color:var(--muted); font-size:13px; padding:10px 0 6px}

  .overlay{position:fixed; inset:0; background:rgba(16,4,8,.78); display:flex; align-items:center; justify-content:center; padding:22px; z-index:10}
  .sheet{background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:18px; width:100%; max-width:330px}
  .sheet h2{margin:0 0 10px; font-size:18px; color:var(--accent)}
  .srow{display:flex; justify-content:space-between; padding:5px 0; font-size:14px; border-bottom:1px solid var(--line)}
  .srow:last-of-type{border-bottom:none}
  .sheet .cta{margin-top:12px}
</style>
</head>
<body>
<div id="app"></div>
<script src="game.js"></script>
<script>createGame(window.Table, document.getElementById('app'));</script>
</body>
</html>
