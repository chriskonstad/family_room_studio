<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Look Away</title>
<style>
  :root{
    --bg1:#2a1636; --bg2:#130a1c; --panel:#3b2150; --line:#5b3878;
    --text:#f4ecfa; --muted:#bda6ce; --accent:#f29ee0; --bad:#ff5c8a; --good:#7fe0b0;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0; color:var(--text); font-family:ui-rounded,-apple-system,system-ui,sans-serif;
    background:radial-gradient(circle at 50% 0%,#3d2152,var(--bg1) 55%,var(--bg2));
    display:flex; flex-direction:column;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  #app{flex:1; display:flex; flex-direction:column; min-height:0; padding:10px 14px 14px}
  .hdr{display:flex; align-items:baseline; gap:8px}
  .brand{font-size:19px; letter-spacing:.13em; font-weight:800; color:var(--accent)}
  .hdr .sub{color:var(--muted); font-size:12.5px; margin-left:auto}

  .lives{display:flex; flex-wrap:wrap; gap:5px 9px; justify-content:center; margin:8px 0 4px}
  .lf{font-size:14px; opacity:.92; white-space:nowrap}
  .lf.out{opacity:.3; filter:grayscale(1)}
  .lf.looker{color:var(--accent); font-weight:800; text-shadow:0 0 8px rgba(242,158,224,.5)}

  .banner{text-align:center; font-weight:800; font-size:18px; min-height:22px; margin:8px 0 2px}

  .tbar{width:100%; max-width:360px; height:9px; background:#1a0f26; border-radius:6px; overflow:hidden; margin:6px auto 0}
  .tbar i{display:block; height:100%; width:100%; background:var(--accent); border-radius:6px}

  .big{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; text-align:center}
  .ic{font-size:70px; line-height:1}
  .hint{color:var(--muted); font-size:14.5px; line-height:1.5; max-width:330px}
  .hint b{color:var(--text)}

  .dirs{flex:1; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); gap:10px;
    width:100%; max-width:300px; margin:14px auto 0; align-content:center}
  .dir{border:none; border-radius:18px; font-size:34px; background:var(--panel); color:var(--text);
    display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:inset 0 -4px 0 rgba(0,0,0,.3)}
  .dir:active{transform:scale(.95)}
  .dir.picked{box-shadow:0 0 0 4px #fff, inset 0 -4px 0 rgba(0,0,0,.3); background:var(--accent); color:#2a1636}
  .dir:disabled{opacity:.3}
  .dir[data-d=up]{grid-area:1/2} .dir[data-d=left]{grid-area:2/1}
  .dir[data-d=ctr]{grid-area:2/2} .dir[data-d=right]{grid-area:2/3} .dir[data-d=down]{grid-area:3/2}
  button.primary{background:var(--accent); color:#2a1636; border:none; border-radius:15px; padding:15px 22px; font-size:17px; font-weight:800; min-height:52px; cursor:pointer}

  .reveal{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px}
  .rlooker{font-size:22px; font-weight:800; color:var(--accent)}
  .rgrid{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; max-width:340px}
  .rp{font-size:20px; padding:7px 11px; border-radius:12px; background:var(--panel)}
  /* the hit animation is fr-flash-bad, fired once per reveal by Table.feel('hit') */
  .rp.caught{background:rgba(255,92,138,.25); box-shadow:0 0 0 2px var(--bad)}
  .wait{color:var(--muted); font-size:14px}
</style>
</head>
<body>
<div id="app"></div>
<script src="game.js"></script>
<script>createGame(window.Table, document.getElementById('app'));</script>
</body>
</html>
