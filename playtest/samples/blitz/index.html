<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>BLITZ</title>
<style>
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none}
  html,body{height:100%}
  body{margin:0; font-family:ui-rounded,-apple-system,system-ui,sans-serif; color:#fff;
    background:radial-gradient(circle at 50% 20%,#3b2a5e,#191036 70%);
    display:flex; flex-direction:column;
    padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
  h1{letter-spacing:.2em; color:#ffd54a; font-size:26px; margin:14px 0 4px}
  .sub{color:#bcaee0; font-size:13px; margin-bottom:14px}
  .scores{display:flex; flex-direction:column; gap:8px}
  .row{display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.08);
    border-radius:12px; padding:10px 12px; font-size:16px}
  .row b{margin-left:auto; font-size:20px}
  .row.win{background:#ffd54a; color:#3a2a06}
  #tap{margin:auto 0 24px; padding:34px; font-size:26px; font-weight:800; border:none;
    border-radius:24px; background:#ffd54a; color:#3a2a06; width:100%}
  #tap:disabled{opacity:.4}
</style>
</head>
<body>
<h1>BLITZ ⚡️</h1>
<div class="sub">First to 10 taps wins</div>
<div class="scores" id="scores"></div>
<button id="tap">TAP!</button>
<script src="game.js"></script>
</body>
</html>
