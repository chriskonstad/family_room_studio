<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>MELTDOWN</title>
<style>
  :root{
    --bg1:#1c1206; --bg2:#0f0902; --panel:#2a1d0c; --line:#4a3418;
    --text:#f6ecdc; --muted:#b09a76; --warn:#f0a132; --bad:#e0564b; --good:#69d876;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none}
  html,body{height:100%}
  body{margin:0; color:var(--text); font-family:ui-rounded,-apple-system,system-ui,sans-serif;
    background:radial-gradient(circle at 50% 0%,#33210b,var(--bg1) 55%,var(--bg2));
    display:flex; flex-direction:column;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  #app{flex:1; display:flex; flex-direction:column; min-height:0; padding:10px 12px 12px}
  .hdr{display:flex; align-items:center; gap:8px}
  .brand{font-size:20px; letter-spacing:.14em; font-weight:900; color:var(--warn)}
  .lvl{margin-left:auto; font-size:13px; color:var(--muted)}
  .lvl b{color:var(--text)}

  .integrity{height:14px; background:#160e04; border:1px solid var(--line); border-radius:8px; overflow:hidden; margin:8px 0 4px}
  .integrity i{display:block; height:100%; background:linear-gradient(90deg,var(--good),#b3d34a); transition:width .3s}
  .integrity.low i{background:linear-gradient(90deg,var(--bad),#f07a32)}
  .integrity.hurt{animation:hurtflash .5s}
  @keyframes hurtflash{0%{box-shadow:0 0 0 rgba(224,86,75,.95)}50%{box-shadow:0 0 20px rgba(224,86,75,.85)}100%{box-shadow:0 0 0 rgba(224,86,75,0)}}
  body.shake{animation:bodyshake .4s}
  @keyframes bodyshake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

  .order{background:#000; border:2px solid var(--warn); border-radius:14px; padding:12px 14px; margin:8px 0;
    font-family:ui-monospace,Menlo,monospace; font-size:17px; font-weight:700; color:#7CFC9E; min-height:64px;
    display:flex; align-items:center; gap:10px}
  .order .t{flex:1}
  .order .clock{font-size:22px; color:var(--warn); font-variant-numeric:tabular-nums}
  .order.urgent{border-color:var(--bad); animation:blink .5s infinite}
  @keyframes blink{50%{border-color:#7a1e15}}
  .order .done{color:var(--good)}

  .panel{flex:1; display:grid; grid-template-columns:1fr 1fr; gap:10px; align-content:start; padding-top:6px}
  .ctl{border-radius:14px; border:1px solid var(--line); background:var(--panel); padding:10px; text-align:center; min-height:88px;
    display:flex; flex-direction:column; justify-content:center; gap:6px}
  .ctl .nm{font-size:12.5px; font-weight:800; letter-spacing:.03em; min-height:28px; display:flex; align-items:center; justify-content:center}
  .ctl button{font:inherit; border:0; border-radius:10px; padding:10px 6px; font-weight:800; cursor:pointer}
  .ctl .push{background:var(--warn); color:#2a1600}
  .ctl .push:active{transform:scale(.96)}
  .ctl .sw{background:#3a2a12; color:var(--muted); padding:13px 6px}
  .ctl .sw.on{background:var(--good); color:#06300f}
  .ctl .dialrow{display:flex; gap:5px; justify-content:center}
  .ctl .dialrow button{flex:1; background:#3a2a12; color:var(--muted); padding:13px 0}
  .ctl .dialrow button.cur{background:var(--warn); color:#2a1600}
  .flash-good{animation:okflash .5s}
  @keyframes okflash{0%{box-shadow:0 0 0 rgba(105,216,118,.9)}100%{box-shadow:0 0 22px rgba(105,216,118,0)}}

  .big{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center}
  .big .icon{font-size:46px}
  .hint{color:var(--muted); font-size:14px; line-height:1.6; max-width:300px}
  button.primary{background:var(--warn); color:#2a1600; border:0; border-radius:14px; padding:14px 20px; font-size:16px; font-weight:800; width:100%; max-width:320px}
  .wait{color:var(--muted); font-size:13px}
</style>
</head>
<body>
<div id="app"></div>
<script src="game.js"></script>
<script>createGame(window.Table, document.getElementById('app'));</script>
</body>
</html>
