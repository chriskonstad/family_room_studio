<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>STREAK</title>
<style>
  :root{
    --felt:#0e2a22; --felt2:#0a1f19; --panel:#15362b; --screen:#0c241d;
    --line:#24473b; --cream:#f3ead6; --ink:#12241d; --gold:#e8b34a;
    --danger:#d9695c; --muted:#93afa3; --text:#e8f2ec; --good:#7fc9a2;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none}
  html,body{height:100%}
  body{
    margin:0; color:var(--text);
    font-family:ui-rounded,-apple-system,system-ui,sans-serif;
    background:radial-gradient(circle at 50% 0%,#1a4034,var(--felt) 55%,var(--felt2));
    display:flex; flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #app{flex:1; display:flex; flex-direction:column; min-height:0; padding:10px 12px 14px}

  .hdr{display:flex; align-items:baseline; gap:10px; padding:4px 2px 2px}
  .brand{font-size:22px; letter-spacing:.18em; font-weight:800; color:var(--gold)}
  .roundlbl{color:var(--muted); font-size:13px}
  .goal{margin-left:auto; color:var(--muted); font-size:13px}
  /* Cards left before the deck reshuffles — this is a real 94-card deck, so
     counting it is a legitimate part of playing well. */
  .deckcount{margin-left:10px; color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums}
  .deckcount.low{color:var(--gold)}

  .banner{min-height:26px; font-size:16px; font-weight:700; color:var(--gold); padding:7px 2px}
  .banner.bust{color:#ff8d80}
  .banner.frozen{color:#8fc6ff}
  .banner.streak{animation:bannerpulse .9s ease-in-out 2}
  @keyframes bannerpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

  .board{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px; min-height:0}
  .prow{border:2px solid transparent; border-radius:16px; padding:10px 12px; background:#0f2b23;
        transition:border-color .25s, background .25s}
  .prow.active-turn{border-color:var(--gold); background:#123328; animation:turnglow 2s ease-in-out infinite}
  @keyframes turnglow{0%,100%{box-shadow:0 0 0 rgba(232,179,74,0)}50%{box-shadow:0 0 14px rgba(232,179,74,.35)}}
  .prow.busted{border-color:rgba(217,105,92,.7); background:rgba(217,105,92,.13)}
  .prow.frozen{border-color:rgba(122,180,238,.7); background:rgba(122,180,238,.13)}
  .prow.stayed{opacity:.7}
  .prow.shake{animation:shake .55s ease-in-out}
  @keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}
    30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
  .prow.freezeflash{animation:freezeflash 1s ease-out}
  @keyframes freezeflash{0%{box-shadow:0 0 0 rgba(122,180,238,.9)}50%{box-shadow:0 0 26px rgba(122,180,238,.8)}100%{box-shadow:0 0 0 rgba(122,180,238,0)}}
  .prow .top{display:flex; align-items:center; gap:7px; font-size:16px}
  .prow .pemoji{font-size:22px}
  .prow .who{font-weight:700}
  .prow .you{color:var(--good); font-size:11px; font-weight:700; letter-spacing:.06em}
  .prow .meta{margin-left:auto; color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; text-align:right}
  .prow .meta b{color:var(--text); font-size:16px}
  .st{font-weight:800; font-size:12.5px; letter-spacing:.03em}
  .st.bust{color:#ff8d80}
  .st.frozen{color:#8fc6ff}
  .st.banked{color:var(--muted)}
  .prow .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; min-height:36px}
  .prow.me-row{background:#143a2d; border-color:var(--line)}
  .prow.me-row.active-turn{border-color:var(--gold)}
  .prow.me-row.busted{border-color:rgba(217,105,92,.7); background:rgba(217,105,92,.13)}
  .prow.me-row.frozen{border-color:rgba(122,180,238,.7); background:rgba(122,180,238,.13)}
  .c{display:inline-flex; align-items:center; justify-content:center; min-width:36px; height:36px; padding:0 7px;
     background:var(--cream); color:var(--ink); border-radius:9px; font-size:18px; font-weight:800; font-variant-numeric:tabular-nums;
     box-shadow:0 2px 0 rgba(0,0,0,.35)}
  .c.mod{background:var(--gold); color:#3a2a06}
  .c.save{background:var(--good); color:#0c2b1c; font-size:11px; letter-spacing:.04em}
  .c.dup{background:var(--danger); color:#fff; animation:duppulse 1.1s ease-in-out 3}
  .c.dup.drawn{outline:2px dashed #fff; outline-offset:-3px}
  @keyframes duppulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
  .c.pop{animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{0%{transform:scale(.2) rotate(-10deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
  .empty{color:var(--muted); font-size:13px; align-self:center}

  .ctrl{padding-top:10px}
  .btnrow{display:flex; gap:10px}
  button{font:inherit; cursor:pointer; border:1px solid var(--line); background:#1d4034; color:var(--text);
    border-radius:14px; padding:15px 12px; font-size:17px; font-weight:700; flex:1}
  button:disabled{opacity:.35}
  button.primary{background:var(--gold); color:#3a2a06; border-color:var(--gold)}
  .wait{display:block; text-align:center; color:var(--muted); font-size:14px; padding:16px 0 12px}

  .overlay{position:fixed; inset:0; background:rgba(5,15,12,.72); display:flex; align-items:center; justify-content:center; padding:24px; z-index:10}
  .sheet{background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:20px; width:100%; max-width:340px;
    box-shadow:0 18px 50px rgba(0,0,0,.5)}
  .sheet h2{margin:0 0 4px; font-size:19px; letter-spacing:.04em}
  .sheet h2.gold{color:var(--gold)}
  .sheet .sub{color:var(--muted); font-size:13px; margin:0 0 14px}
  .sheet .rowbtns{display:flex; flex-direction:column; gap:9px}
  .score-row{display:flex; align-items:center; gap:8px; padding:7px 2px; font-size:15px; border-bottom:1px solid var(--line)}
  .score-row:last-of-type{border-bottom:none}
  .score-row .pts{margin-left:auto; font-variant-numeric:tabular-nums; color:var(--muted)}
  .score-row .pts b{color:var(--text); font-size:16px}
  .score-row.winner{color:var(--gold); font-weight:800}
  .sheet .cta{margin-top:14px}
</style>
</head>
<body>
<div id="app"></div>
<script src="game.js"></script>
<script>createGame(window.Table, document.getElementById('app'));</script>
</body>
</html>
