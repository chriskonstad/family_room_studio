<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>TEMPO</title>
<style>
  :root{
    --bg1:#160f2c; --bg2:#0a0618; --panel:#221743; --line:#3b2a6b;
    --text:#efeaff; --muted:#a394cf; --accent:#c05af0; --good:#69d896; --gold:#f0c04a; --bad:#e0695c;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; touch-action:manipulation}
  html,body{height:100%}
  body{margin:0; color:var(--text); font-family:ui-rounded,-apple-system,system-ui,sans-serif;
    background:radial-gradient(circle at 50% 0%,#2a1b52,var(--bg1) 55%,var(--bg2));
    display:flex; flex-direction:column; overflow:hidden;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  #app{flex:1; display:flex; flex-direction:column; min-height:0; padding:10px 14px 12px}
  .hdr{display:flex; align-items:baseline; gap:8px}
  .brand{font-size:20px; letter-spacing:.2em; font-weight:900; color:var(--accent)}
  .hdr .sub{color:var(--muted); font-size:12.5px; margin-left:auto}

  .scores{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 4px}
  .sc{background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:3px 10px; font-size:12px}
  .sc b{font-variant-numeric:tabular-nums}

  .stage{flex:1; position:relative; display:flex; align-items:center; justify-content:center}
  .ring{width:190px; height:190px; border-radius:50%; border:4px solid var(--line); position:relative;
    display:flex; align-items:center; justify-content:center}
  .pulse{position:absolute; inset:-4px; border-radius:50%; border:4px solid var(--accent); opacity:0; transform:scale(1.8)}
  .pulse.animate{animation:closein var(--beatms) linear}
  @keyframes closein{0%{opacity:0; transform:scale(1.8)}20%{opacity:.9}100%{opacity:1; transform:scale(1)}}
  .verdict{font-size:26px; font-weight:900; position:absolute; top:14%; left:0; right:0; text-align:center; opacity:0}
  .verdict.show{animation:vpop .5s ease-out}
  @keyframes vpop{0%{opacity:0; transform:scale(.6)}30%{opacity:1; transform:scale(1.15)}100%{opacity:0; transform:scale(1)}}
  .verdict.perfect{color:var(--gold)} .verdict.good{color:var(--good)} .verdict.miss{color:var(--bad)}
  .combo{position:absolute; bottom:12%; left:0; right:0; text-align:center; font-size:15px; color:var(--muted)}
  .combo b{color:var(--gold); font-size:19px}

  .tapzone{position:absolute; inset:0}
  .beatnum{font-size:44px; font-weight:900; color:var(--muted)}

  .big{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center}
  .big .icon{font-size:46px}
  .hint{color:var(--muted); font-size:14px; line-height:1.6; max-width:300px}
  button.primary{font:inherit; background:var(--accent); color:#fff; border:0; border-radius:14px; padding:14px 20px;
    font-size:16px; font-weight:800; width:100%; max-width:320px; cursor:pointer}
  .wait{color:var(--muted); font-size:13px}
</style>
</head>
<body>
<div id="app"></div>
<script src="game.js"></script>
<script>createGame(window.Table, document.getElementById('app'));</script>
</body>
</html>
