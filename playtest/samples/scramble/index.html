<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SCRAMBLE</title>
<style>
  :root{
    --bg1:#2a1b45; --bg2:#160d27; --panel:#352457; --line:#4b3677;
    --text:#f4eeff; --muted:#a493c7; --accent:#ffd166; --good:#6ee7a8; --bad:#ff7a8a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0; color:var(--text); font-family:ui-rounded,-apple-system,system-ui,sans-serif;
    background:radial-gradient(circle at 50% 0%,#3b2660,var(--bg1) 55%,var(--bg2));
    display:flex; flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  #app{flex:1; display:flex; flex-direction:column; min-height:0}
  .wrap{flex:1; display:flex; flex-direction:column; min-height:0; padding:10px 14px 12px; gap:8px}
  .wrap.center{align-items:center; justify-content:center; text-align:center; gap:14px}

  .hdr{display:flex; align-items:baseline; gap:8px}
  .brand{font-size:19px; letter-spacing:.16em; font-weight:800; color:var(--accent)}
  .sub{color:var(--muted); font-size:12.5px}
  .time{margin-left:auto; font-size:21px; font-weight:900; font-variant-numeric:tabular-nums}
  .time.low{color:var(--bad)}

  .count{font-size:84px; font-weight:900; line-height:1; color:var(--accent)}
  .big{font-size:23px; font-weight:800}
  .hint{color:var(--muted); font-size:13.5px; line-height:1.55}
  .waiting{color:var(--muted); font-size:15px; text-align:center; margin:auto}

  /* The word you are drawing is also the verdict on it: it turns green when it
     banks and red when it doesn't, where it already is. No status line to read. */
  .forming{min-height:34px; font-size:27px; font-weight:900; letter-spacing:.14em;
    text-align:center; color:var(--muted); transition:color .12s ease}
  .forming.ready{color:var(--text)}
  .forming.sent{color:var(--muted)}
  .forming.good{color:var(--good)}
  .forming.bad{color:var(--bad)}
  .why{min-height:16px; text-align:center; font-size:12.5px; color:var(--muted)}

  /* The letters, and a finger on them. A 4x4 grid across a phone gives ~90pt
     tiles — twice the 44pt floor, and about right for dragging at speed. */
  .boardwrap{position:relative; width:100%; max-width:390px; margin:2px auto 6px; aspect-ratio:1}
  .board{position:absolute; inset:0; display:grid; grid-template-columns:repeat(4,1fr);
    gap:7px; touch-action:none; -webkit-user-select:none; user-select:none}
  .cell{background:#f3e9d2; color:#2a1b45; border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    font-size:30px; font-weight:900; letter-spacing:.02em;
    transition:transform .08s ease, background .08s ease}
  .cell.on{background:var(--accent); transform:scale(.94)}
  .cell.on.head{background:#fff0c2; transform:scale(1.02)}
  /* The trail sits over the tiles and must never eat a touch. */
  .trail{position:absolute; inset:0; pointer-events:none}
  .trail polyline{fill:none; stroke:rgba(255,209,102,.85); stroke-width:4;
    stroke-linecap:round; stroke-linejoin:round; vector-effect:non-scaling-stroke}

  /* Your words, one per line, newest on top — a list you can read down while you
     play instead of a bag of chips to hunt through. No numbers anywhere: the
     whole point is that nobody knows where they stand until the screen says. */
  .chips{flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column;
    gap:5px; padding:2px 0}
  .chip{background:var(--panel); border:1px solid var(--line); border-radius:11px;
    padding:9px 13px; font-size:15px; font-weight:800; letter-spacing:.09em;
    display:flex; align-items:center; justify-content:space-between; gap:10px}
  .chip i{font-style:normal; font-size:11px; font-weight:800; letter-spacing:.06em;
    color:var(--muted); text-transform:uppercase}
  .chip i.only{color:var(--accent)}
  .chip.uniq{border-color:var(--accent)}
  .chip.shared{opacity:.55}

  .foot{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--muted)}
  button{font:inherit; cursor:pointer; border:1px solid var(--line); background:var(--panel);
    color:var(--text); border-radius:14px; padding:13px 18px; font-size:15px; font-weight:800;
    margin-left:auto; min-height:46px}
  button:disabled{opacity:.35}
  #next{background:var(--accent); color:#2a1b45; border-color:var(--accent)}

  .scored{text-align:center; padding:4px 0 6px}
  .scored .big{font-size:21px; font-weight:800; margin-bottom:3px}
</style>
</head>
<body>
<div id="app"></div>
<script src="dict.js"></script>
<script src="rules.js"></script>
<script src="game.js"></script>
<script>createGame(window.Table, document.getElementById('app'));</script>
</body>
</html>
